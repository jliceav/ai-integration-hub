# Levanta la API + PostgreSQL con un solo comando:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hub:hub@db:5432/hub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # la API espera a que la BD esté lista
    restart: unless-stopped

volumes:
  pgdata:
